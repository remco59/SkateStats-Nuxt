services:
  skatestats:
    build: .
    container_name: skatestats
    user: "99:100"
    restart: unless-stopped
    env_file: ./.env
    environment:
      # NUXT_DB_PATH is what the running server actually reads (Nuxt
      # runtime-config env override); SKATESTATS_DB is what
      # bootstrap-admin.ts/migration-spike.ts read when run via `exec`.
      # Both must point at the same file, inside the mounted /data volume.
      - NUXT_DB_PATH=/data/skatestats.sqlite
      - SKATESTATS_DB=/data/skatestats.sqlite
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./data:/data
    ports:
      - '8092:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Runs `git pull` + `docker compose up --build` against the host's
  # Docker socket on behalf of the admin panel's "update" button. Kept as
  # a separate container -- not code inside the skatestats service --
  # because that socket access is root-equivalent on the host and must
  # never sit on the same container that serves public HTTP traffic. Not
  # given a `ports:` entry, so it's reachable only from `skatestats` over
  # the compose-internal network, never from the host or internet.
  updater:
    build: ./docker/updater
    container_name: skatestats-updater
    restart: unless-stopped
    environment:
      - UPDATER_SECRET=${UPDATER_SECRET}
      - APP_SERVICE=skatestats
      - REPO_DIR=/repo
    volumes:
      - .:/repo
      - /var/run/docker.sock:/var/run/docker.sock
