services:
  skatestats:
    build: .
    container_name: skatestats
    restart: unless-stopped
    env_file: ./.env
    environment:
      - SKATESTATS_DB=/data/skatestats.sqlite
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      - ./data:/data
    ports:
      - '8090:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
